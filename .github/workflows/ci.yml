name: CI

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main, development]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: book_tracker_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            HUSKY: 0

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create .env.test
              run: |
                  cat <<'EOF' > .env.test
                  PORT=3000
                  PUBLIC_PATH=public
                  POSTGRES_URL=postgresql://postgres:postgres@localhost:5432/book_tracker_test
                  POSTGRES_USER=postgres
                  POSTGRES_DB=book_tracker_test
                  POSTGRES_PORT=5432
                  POSTGRES_PASSWORD=postgres
                  JWT_SEED=ci-test-seed
                  BOOKS_API=https://www.googleapis.com/books/v1
                  GOOGLE_BOOKS_API_KEY=ci-dummy-key
                  EOF

            - name: Generate Prisma client
              run: npx prisma generate
              env:
                  POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/book_tracker_test

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 7
